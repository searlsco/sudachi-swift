name: Release

# Manual release: builds the xcframework, computes its checksum, rewrites
# Package.swift + Cargo.toml to the new version, commits, tags, and publishes a
# GitHub Release with the xcframework archive attached. Doing the version bump
# *before* tagging keeps the tag's Package.swift checksum consistent with the
# uploaded artifact (avoids the checksum/tag chicken-and-egg).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # sudachi.rs is an on-demand checkout pinned by third_party/sudachi.rs.pin,
      # not a submodule (see scripts/fetch-sudachi-rs.sh). build-ios.sh fetches it
      # too; doing it here keeps the failure mode obvious in the log.
      - name: Fetch sudachi.rs (pinned)
        run: scripts/fetch-sudachi-rs.sh

      - name: Validate version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "::error::version '${{ inputs.version }}' is not valid semver"
            exit 1
          fi

      - name: Add Apple Rust targets + llvm-tools
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim \
            aarch64-apple-darwin aarch64-apple-ios-macabi
          rustup component add llvm-tools-preview

      - name: Build xcframework
        run: scripts/build-ios.sh

      # Same coverage gates as CI, so a failing test stops the release before
      # anything is committed, tagged, or published. The tests need the core
      # dictionary (pinned to CI's version so both share one cache entry).
      - name: Cache SudachiDict (core, 20260723)
        id: dict-cache
        uses: actions/cache@v6
        with:
          path: dictionaries
          key: sudachidict-core-20260723

      - name: Fetch dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-dictionary.sh core 20260723

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage gates
        run: scripts/coverage.sh

      - name: Archive xcframework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Sudachi.xcframework build/Sudachi.xcframework.zip

      - name: Compute checksum
        id: checksum
        run: |
          CS=$(swift package compute-checksum build/Sudachi.xcframework.zip)
          echo "value=$CS" >> "$GITHUB_OUTPUT"
          echo "Checksum: $CS"

      - name: Rewrite Package.swift and Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          # Repo-agnostic: point the whole download URL at this repository so a
          # fork's releases reference the fork, not the original upstream.
          sed -i '' -E \
            "s#url: \"https://github.com/[^/]+/[^/]+/releases/download/v[0-9][^/]*/#url: \"https://github.com/${{ github.repository }}/releases/download/v${VERSION}/#" \
            Package.swift
          sed -i '' -E \
            "s#checksum: \"[a-f0-9]{64}\"#checksum: \"${CHECKSUM}\"#" \
            Package.swift
          sed -i '' -E "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          # Keep Cargo.lock's version stamp for the workspace crate in sync.
          cargo update --workspace --offline || cargo update --workspace

          # Verify every rewrite landed — fail loudly rather than tag a
          # release whose manifest still points at the previous version.
          grep -q "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/" Package.swift
          grep -q "checksum: \"${CHECKSUM}\"" Package.swift
          grep -q "^version = \"${VERSION}\"" Cargo.toml
          echo "--- Package.swift ---"; grep -E 'url:|checksum:' Package.swift

      - name: Commit, tag, and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift Cargo.toml Cargo.lock
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            build/Sudachi.xcframework.zip \
            --title "v${VERSION}" \
            --generate-notes
