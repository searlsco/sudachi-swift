[workspace]
resolver = "2"
members = ["crates/sudachi-swift-uniffi"]
exclude = ["third_party"]

[workspace.package]
version = "0.3.2"
edition = "2021"
description = "Swift bindings for the Sudachi Japanese morphological analyzer (sudachi.rs) via UniFFI"
authors = ["Ilia Snezhkov <iasnezhkov@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/searlsco/sudachi-swift"

[profile.release]
opt-level = 3
# LTO stays off: it would embed LLVM bitcode in the built objects, and Xcode's
# previews JIT (XOJIT, which statically links its own older LLVM) crashes
# parsing bitcode from Rust's newer LLVM. build-ios.sh enforces this with a
# __LLVM-section tripwire on every built slice.
lto = false
codegen-units = 1
# Debug info stays in the intermediate dylib so build-ios.sh can lift a .dSYM
# out of it before stripping the copy it packages into the framework. The
# shipped binary is unchanged; only the xcframework gains symbols, without
# which crash reports from the Rust core cannot be symbolicated at all.
# Line tables only: enough for function/file/line frames at a third the size
# of full DWARF.
debug = "line-tables-only"
strip = false
